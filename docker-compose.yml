version: "3.8"

services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  user-service:
    build: ../user-service
    ports:
      - "8082:8082"
      - "9090:9090"

  message-service:
    build: ../message-service
    ports:
      - "8083:8083"

  bot-service:
    build: ../bot-service
    ports:
      - "8084:8084"

  auth-service:
    build: ../auth-service
    ports:
      - "8081:8081"

  bff:
    build: ../bff
    ports:
      - "8080:8080"