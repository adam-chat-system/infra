apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: chatapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
            - containerPort: 9090

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: chatapp
spec:
  selector:
    app: user-service
  ports:
    - name: rest
      port: 8082
      targetPort: 8082

    - name: grpc
      port: 9090
      targetPort: 9090