apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-service
  namespace: chatapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: message-service
  template:
    metadata:
      labels:
        app: message-service
    spec:
      containers:
        - name: message-service
          image: message-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8083

          env:
            - name: RABBITMQ_HOST
              value: rabbitmq

            - name: APP_RABBITMQ_PORT
              value: "5672"

            - name: USER_SERVICE_HOST
              value: user-service

---
apiVersion: v1
kind: Service
metadata:
  name: message-service
  namespace: chatapp
spec:
  selector:
    app: message-service
  ports:
    - port: 8083
      targetPort: 8083