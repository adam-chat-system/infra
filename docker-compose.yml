services:

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  user-service:
    build: ../user-service
    ports:
      - "8082:8082"
      - "9090:9090"

  message-service:
    build: ../message-service
    ports:
      - "8083:8083"
    environment:
      - RABBITMQ_HOST=rabbitmq
      - USER_SERVICE_HOST=user-service
    depends_on:
      - user-service
      - rabbitmq

  bot-service:
    build: ../bot-service
    ports:
      - "8084:8084"
    environment:
      - MESSAGE_SERVICE_URL=http://message-service:8083
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - message-service
      - rabbitmq

  auth-service:
    build: ../auth-service
    ports:
      - "8081:8081"
    environment:
      - SECURITY_JWT_SECRET=mysupersecretkeymysupersecretkey123456
      - USER_SERVICE_HOST=user-service
      - AUTH_DEV_MODE=true
    depends_on:
      - user-service

  bff:
    build: ../bff
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - USER_SERVICE_URL=http://user-service:8082
      - MESSAGE_SERVICE_URL=http://message-service:8083
      - BOT_SERVICE_URL=http://bot-service:8084
      - SECURITY_JWT_SECRET=mysupersecretkeymysupersecretkey123456
    depends_on:
      - auth-service
      - message-service
      - user-service