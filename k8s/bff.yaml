apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: chatapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      containers:
        - name: bff
          image: bff:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

          env:
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8081

            - name: USER_SERVICE_URL
              value: http://user-service:8082

            - name: MESSAGE_SERVICE_URL
              value: http://message-service:8083

            - name: BOT_SERVICE_URL
              value: http://bot-service:8084

            - name: SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chatapp-secret
                  key: SECURITY_JWT_SECRET

---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: chatapp
spec:
  type: NodePort
  selector:
    app: bff
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080