apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-service
  namespace: chatapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bot-service
  template:
    metadata:
      labels:
        app: bot-service
    spec:
      containers:
        - name: bot-service
          image: bot-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084

          env:
            - name: RABBITMQ_HOST
              value: rabbitmq

            - name: APP_RABBITMQ_PORT
              value: "5672"

            - name: MESSAGE_SERVICE_URL
              value: http://message-service:8083

---
apiVersion: v1
kind: Service
metadata:
  name: bot-service
  namespace: chatapp
spec:
  selector:
    app: bot-service
  ports:
    - port: 8084
      targetPort: 8084